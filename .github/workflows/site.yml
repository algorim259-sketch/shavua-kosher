# Met le site en ligne sur GitHub Pages.
# - à chaque envoi sur la branche main ;
# - chaque nuit vers 3 h en hiver, 4 h en été (heure d'Israël) avec les prix du jour ;
# - à la main depuis l'onglet « Actions » (bouton « Run workflow »).
# Si les sites des chaînes refusent la connexion, le site reste en ligne avec les derniers prix enregistrés.
name: Site en ligne

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prix du jour (toutes les chaînes)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/fetch-prices.mjs

      - name: Données du site
        run: node scripts/build-data.mjs

      - name: Tests
        run: node tests/run-tests.mjs

      - name: Garder les nouveaux prix dans le dépôt
        if: github.event_name != 'push'
        run: |
          git config user.name "prix-automatiques"
          git config user.email "actions@users.noreply.github.com"
          git add data/stores.json data/cities.json web/prices web/data.js
          git diff --cached --quiet || (git commit -m "Prix du $(date +%d/%m/%Y)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
